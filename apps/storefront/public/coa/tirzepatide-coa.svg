    <text x="60" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">0</text>
    <text x="140" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">2</text>
    <text x="220" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">5</text>
    <text x="320" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">8</text>
    <text x="440" y="210" text-anchor="middle" class="mono" fill="#10b981" font-size="9.5" font-weight="700">11.20</text>
    <text x="540" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">15</text>
    <text x="620" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">20 min</text>

    <!-- Shaded Peak Area (AUC) -->
    <path d="M410,193 C422,193 430,160 438,100 C439,70 440,42 440,42 C440,42 441,70 443,100 C448,160 458,193 470,193 Z" fill="url(#chromaGradTZP)" />

    <!-- Trace curve -->
    <path d="M60,194 L100,194 Q108,187 112,176 Q115,194 122,194 L375,194 Q380,193 385,190 Q390,193 398,193 L410,193 C422,193 430,160 438,100 C439,70 440,42 440,42 C440,42 441,70 443,100 C448,160 458,193 470,193 L510,193 Q515,192 518,189 Q522,193 528,193 L650,193" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" />

    <text x="112" y="167" text-anchor="middle" class="mono" fill="#94a3b8" font-size="7.5">V₀ (1.2m)</text>

