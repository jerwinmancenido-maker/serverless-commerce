    <text x="240" y="55" class="mono bold" fill="#047857" font-size="9">40,120.4</text>
    <text x="370" y="55" class="mono bold" fill="#047857" font-size="9">1,248.6</text>
    <text x="490" y="55" class="mono bold" fill="#047857" font-size="9">Tirzepatide Pure Incretin</text>
    <text x="600" y="55" class="mono bold" fill="#047857" font-size="9">99.51%</text>

    <text x="20" y="70" class="mono" fill="#64748b" font-size="9">3</text>
