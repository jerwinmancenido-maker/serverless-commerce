    <text x="457" y="34" text-anchor="middle" class="mono" fill="#ffffff" font-size="8.5" font-weight="700">99.51% @ 11.20 min</text>
    <line x1="440" y1="40" x2="440" y2="42" stroke="#10b981" stroke-width="1.5" />
  </g>

