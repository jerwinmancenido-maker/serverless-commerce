      <text x="0" y="45" font-family="'Brush Script MT', cursive, sans-serif" font-size="24" fill="#1e293b">Dr. A. Vance</text>
      <line x1="0" y1="55" x2="190" y2="55" stroke="#94a3b8" stroke-width="1" />
      <text x="0" y="70" class="value bold">Dr. A. Vance, Ph.D.</text>
      <text x="0" y="84" class="header-meta">Senior Analytical Chemist, LC/MS</text>
    </g>

    <g transform="translate(250, 20)">
      <text x="0" y="15" class="header-meta">REVIEWED &amp; APPROVED BY:</text>
      <text x="0" y="45" font-family="'Brush Script MT', cursive, sans-serif" font-size="24" fill="#1e293b">R. Castillo</text>
      <line x1="0" y1="55" x2="190" y2="55" stroke="#94a3b8" stroke-width="1" />
      <text x="0" y="70" class="value bold">R. Castillo, RCh, M.Sc.</text>
      <text x="0" y="84" class="header-meta">Quality Assurance Director</text>
    </g>

    <g transform="translate(480, 16)">
      <rect x="0" y="0" width="180" height="115" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="90" cy="42" r="28" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4,2" />
      <text x="90" y="38" text-anchor="middle" class="mono bold" fill="#047857" font-size="8">ISO/IEC 17025</text>
      <text x="90" y="48" text-anchor="middle" class="mono" fill="#047857" font-size="7">ACCREDITED</text>
      <text x="90" y="85" text-anchor="middle" class="mono bold" fill="#0f172a" font-size="8.5">QC RELEASED</text>
      <text x="90" y="98" text-anchor="middle" class="mono" fill="#64748b" font-size="7">CRYPTOGRAPHIC HASH: 91c4..3b28</text>
