<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #047857; letter-spacing: 0.08em; text-transform: uppercase; }
      .header-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-transform: uppercase; letter-spacing: 0.06em; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; }
      .bold { font-weight: 700; }
      .pass { fill: #047857; font-weight: 700; }
      .watermark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 900; fill: #f1f5f9; letter-spacing: 0.1em; }
    </style>
    <linearGradient id="chromaGradGHK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Paper Canvas -->
  <rect width="800" height="1130" fill="#ffffff" />
  <rect x="25" y="25" width="750" height="1080" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtle Security Border & Background Watermark -->
  <rect x="35" y="35" width="730" height="1060" rx="6" fill="none" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="6,4" />
  <text x="400" y="600" text-anchor="middle" class="watermark" transform="rotate(-30, 400, 600)">CERTIFICATE OF ANALYSIS</text>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 65)">
    <!-- Accredited Lab Logo Block -->
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#0f172a" />
    <path d="M16 14v16a8 8 0 0 0 16 0V14" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="22" r="2.5" fill="#10b981" />
    
    <text x="62" y="18" class="subtitle">BioAnalytical Reference Standards Laboratory</text>
    <text x="62" y="38" class="title">CERTIFICATE OF ANALYSIS</text>
    <text x="62" y="52" class="header-meta">ISO/IEC 17025:2017 Testing Laboratory Accreditation #ISO-PH-8821 · Ref: ASTM E2554</text>

    <!-- Certificate Metadata Box (Right) -->
    <rect x="490" y="-5" width="190" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="502" y="12" class="header-meta">CERTIFICATE ID: <tspan class="mono bold" fill="#0f172a">COA-2026-GHK-094</tspan></text>
    <text x="502" y="28" class="header-meta">LOT NUMBER: <tspan class="mono bold" fill="#047857">PH8-GHK-2026B</tspan></text>
    <text x="502" y="44" class="header-meta">ANALYSIS DATE: <tspan class="mono" fill="#0f172a">FEB 18, 2026</tspan></text>
    <text x="502" y="58" class="header-meta">RETEST DATE: <tspan class="mono" fill="#0f172a">FEB 18, 2028</tspan></text>
  </g>

  <line x1="60" y1="145" x2="740" y2="145" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== SECTION 1: COMPOUND SPECIFICATION ==================== -->
  <g transform="translate(60, 165)">
    <text x="0" y="0" class="h2">1. Compound Identity &amp; Physicochemical Properties</text>
    <rect x="0" y="12" width="680" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <text x="16" y="34" class="label">Product Name:</text>
    <text x="125" y="34" class="value bold">Copper Tripeptide-1 (GHK-Cu)</text>

    <text x="370" y="34" class="label">CAS Registry #:</text>
    <text x="475" y="34" class="mono value">49557-75-7 / 89030-95-5</text>

    <text x="16" y="56" class="label">IUPAC Designation:</text>
    <text x="125" y="56" class="value" font-size="9.5">Copper(2+) (2S)-6-amino-2-[[(2S)-2-[[(2S)-2-aminoacetyl]amino]-3-(1H-imidazol-5-yl)propanoyl]amino]hexanoate</text>

    <text x="16" y="78" class="label">Molecular Formula:</text>
    <text x="125" y="78" class="mono value bold">C14H24CuN6O4</text>

    <text x="370" y="78" class="label">Molecular Weight:</text>
    <text x="475" y="78" class="mono value bold">403.93 g/mol</text>

    <text x="16" y="98" class="label">Physical State:</text>
    <text x="125" y="98" class="value">Sterile crimped vial, fine royal-blue lyophilized solid cake</text>

    <text x="370" y="98" class="label">Recommended Storage:</text>
    <text x="500" y="98" class="value">-20°C desiccated, protect from light</text>
  </g>

  <!-- ==================== SECTION 2: HPLC CHROMATOGRAM ==================== -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" class="h2">2. High-Performance Liquid Chromatography (RP-HPLC Profile)</text>
    <text x="440" y="0" class="header-meta">Column: C18 4.6x250mm, 5µm · Eluent: ACN/H2O 0.1% TFA</text>

    <!-- Chromatogram Canvas Frame -->
    <rect x="0" y="14" width="680" height="230" rx="6" fill="#0f172a" />

    <!-- Grid lines -->
    <line x1="60" y1="40" x2="650" y2="40" stroke="#334155" stroke-dasharray="2,3" stroke-width="0.8" />
    <line x1="60" y1="90" x2="650" y2="90" stroke="#334155" stroke-dasharray="2,3" stroke-width="0.8" />
    <line x1="60" y1="140" x2="650" y2="140" stroke="#334155" stroke-dasharray="2,3" stroke-width="0.8" />
    <line x1="60" y1="190" x2="650" y2="190" stroke="#334155" stroke-dasharray="2,3" stroke-width="0.8" />

    <!-- Y Axis Labels (mAU) -->
    <text x="50" y="44" text-anchor="end" class="mono" fill="#94a3b8" font-size="9">1200</text>
    <text x="50" y="94" text-anchor="end" class="mono" fill="#94a3b8" font-size="9">800</text>
    <text x="50" y="144" text-anchor="end" class="mono" fill="#94a3b8" font-size="9">400</text>
    <text x="50" y="194" text-anchor="end" class="mono" fill="#94a3b8" font-size="9">0</text>
    <text x="22" y="115" text-anchor="middle" class="mono" fill="#64748b" font-size="8.5" transform="rotate(-90, 22, 115)">Absorbance (mAU @ 214nm)</text>

    <!-- X Axis (Retention Time in Minutes) -->
    <line x1="60" y1="195" x2="650" y2="195" stroke="#64748b" stroke-width="1.2" />
    <text x="60" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">0</text>
    <text x="140" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">2</text>
    <text x="220" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">4</text>
    <text x="300" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">6</text>
    <text x="357" y="210" text-anchor="middle" class="mono" fill="#10b981" font-size="9.5" font-weight="700">7.42</text>
    <text x="460" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">10</text>
    <text x="540" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">12</text>
    <text x="620" y="210" text-anchor="middle" class="mono" fill="#94a3b8" font-size="9">14 min</text>

    <!-- Shaded Peak Area (AUC) -->
    <path d="M330,193 C340,193 348,160 354,100 C356,70 357,45 357,45 C357,45 358,70 360,100 C366,160 374,193 384,193 Z" fill="url(#chromaGradGHK)" />

    <!-- Chromatogram Trace Curve -->
    <path d="M60,194 L100,194 Q108,186 112,175 Q115,194 122,194 L295,194 Q305,193 310,188 Q315,193 322,193 L330,193 C340,193 348,160 354,100 C356,70 357,45 357,45 C357,45 358,70 360,100 C366,160 374,193 384,193 L440,193 Q445,191 448,187 Q452,193 458,193 L650,193" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" />

    <!-- Solvent Front Tag -->
    <text x="112" y="166" text-anchor="middle" class="mono" fill="#94a3b8" font-size="7.5">V₀ (1.2m)</text>

    <!-- Main Peak Tag Callout -->
    <rect x="330" y="24" width="90" height="18" rx="3" fill="#047857" />
    <text x="375" y="36" text-anchor="middle" class="mono" fill="#ffffff" font-size="8.5" font-weight="700">99.34% @ 7.42 min</text>
    <line x1="357" y1="42" x2="357" y2="45" stroke="#10b981" stroke-width="1.5" />
  </g>

  <!-- Chromatographic Integration Table -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="680" height="75" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="0" width="680" height="22" rx="5" fill="#f1f5f9" />
    <text x="20" y="15" class="mono bold" fill="#475569" font-size="9">PEAK #</text>
    <text x="90" y="15" class="mono bold" fill="#475569" font-size="9">RETENTION TIME (tR)</text>
    <text x="240" y="15" class="mono bold" fill="#475569" font-size="9">AREA (µV·s)</text>
    <text x="370" y="15" class="mono bold" fill="#475569" font-size="9">HEIGHT (µV)</text>
    <text x="490" y="15" class="mono bold" fill="#475569" font-size="9">PEAK TYPE</text>
    <text x="600" y="15" class="mono bold" fill="#475569" font-size="9">AREA %</text>

    <!-- Row 1: Impurity A -->
    <text x="20" y="36" class="mono" fill="#64748b" font-size="9">1</text>
    <text x="90" y="36" class="mono" fill="#64748b" font-size="9">6.18 min</text>
    <text x="240" y="36" class="mono" fill="#64748b" font-size="9">142.6</text>
    <text x="370" y="36" class="mono" fill="#64748b" font-size="9">18.4</text>
    <text x="490" y="36" class="mono" fill="#64748b" font-size="9">Related Impurity A</text>
    <text x="600" y="36" class="mono" fill="#64748b" font-size="9">0.38%</text>

    <!-- Row 2: Main Analyte (GHK-Cu) -->
    <rect x="0" y="42" width="680" height="18" fill="#ecfdf5" />
    <text x="20" y="55" class="mono bold" fill="#047857" font-size="9">2</text>
    <text x="90" y="55" class="mono bold" fill="#047857" font-size="9">7.42 min</text>
    <text x="240" y="55" class="mono bold" fill="#047857" font-size="9">37,218.4</text>
    <text x="370" y="55" class="mono bold" fill="#047857" font-size="9">1,185.0</text>
    <text x="490" y="55" class="mono bold" fill="#047857" font-size="9">Copper Tripeptide-1</text>
    <text x="600" y="55" class="mono bold" fill="#047857" font-size="9">99.34%</text>

    <!-- Row 3: Impurity B -->
    <text x="20" y="70" class="mono" fill="#64748b" font-size="9">3</text>
    <text x="90" y="70" class="mono" fill="#64748b" font-size="9">9.85 min</text>
    <text x="240" y="70" class="mono" fill="#64748b" font-size="9">104.2</text>
    <text x="370" y="70" class="mono" fill="#64748b" font-size="9">14.1</text>
    <text x="490" y="70" class="mono" fill="#64748b" font-size="9">Related Impurity B</text>
    <text x="600" y="70" class="mono" fill="#64748b" font-size="9">0.28%</text>
  </g>

  <!-- ==================== SECTION 3: ANALYTICAL QUALITY CONTROL SUMMARY ==================== -->
  <g transform="translate(60, 635)">
    <text x="0" y="0" class="h2">3. Comprehensive Quality Control Release Specifications</text>
    
    <rect x="0" y="12" width="680" height="210" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="12" width="680" height="24" rx="6" fill="#f8fafc" />
    <text x="16" y="28" class="label bold">TEST PARAMETER</text>
    <text x="210" y="28" class="label bold">METHOD</text>
    <text x="370" y="28" class="label bold">ACCEPTANCE CRITERIA</text>
    <text x="530" y="28" class="label bold">RESULT</text>
    <text x="635" y="28" class="label bold">STATUS</text>
    
    <!-- Row 1: Appearance -->
    <line x1="0" y1="60" x2="680" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="52" class="value">Visual Appearance</text>
    <text x="210" y="52" class="mono header-meta">Visual Inspection</text>
    <text x="370" y="52" class="header-meta">Royal-blue lyophilized cake</text>
    <text x="530" y="52" class="mono value">Conforms</text>
    <text x="635" y="52" class="pass">PASS</text>

    <!-- Row 2: HPLC Purity -->
    <line x1="0" y1="85" x2="680" y2="85" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="77" class="value bold">Chromatographic Purity</text>
    <text x="210" y="77" class="mono header-meta">RP-HPLC (UV 214nm)</text>
    <text x="370" y="77" class="header-meta">≥ 99.0% (Integrated AUC)</text>
    <text x="530" y="77" class="mono value bold" fill="#047857">99.34%</text>
    <text x="635" y="77" class="pass">PASS</text>

    <!-- Row 3: Mass Spec -->
    <line x1="0" y1="110" x2="680" y2="110" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="102" class="value">Identity Verification</text>
    <text x="210" y="102" class="mono header-meta">ESI-MS (Positive Mode)</text>
    <text x="370" y="102" class="header-meta">[M+H]+ = 403.93 ± 0.5 Da</text>
    <text x="530" y="102" class="mono value">404.01 Da</text>
    <text x="635" y="102" class="pass">PASS</text>

    <!-- Row 4: Peptide Content -->
    <line x1="0" y1="135" x2="680" y2="135" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="127" class="value">Peptide Content</text>
    <text x="210" y="127" class="mono header-meta">Elemental N Analysis</text>
    <text x="370" y="127" class="header-meta">≥ 80.0% Net Active Mass</text>
    <text x="530" y="127" class="mono value">86.4%</text>
    <text x="635" y="127" class="pass">PASS</text>

    <!-- Row 5: Moisture -->
    <line x1="0" y1="160" x2="680" y2="160" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="152" class="value">Moisture Content</text>
    <text x="210" y="152" class="mono header-meta">Karl Fischer Titration</text>
    <text x="370" y="152" class="header-meta">≤ 8.0% residual H2O</text>
    <text x="530" y="152" class="mono value">3.8%</text>
    <text x="635" y="152" class="pass">PASS</text>

    <!-- Row 6: Endotoxin -->
    <line x1="0" y1="185" x2="680" y2="185" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="177" class="value bold">Bacterial Endotoxin</text>
    <text x="210" y="177" class="mono header-meta">LAL Turbidimetric (USP &lt;85&gt;)</text>
    <text x="370" y="177" class="header-meta">&lt; 0.10 EU/mg</text>
    <text x="530" y="177" class="mono value bold" fill="#047857">&lt; 0.03 EU/mg</text>
    <text x="635" y="177" class="pass">PASS</text>

    <!-- Row 7: Sterility -->
    <text x="16" y="202" class="value bold">Bioburden &amp; Sterility</text>
    <text x="210" y="202" class="mono header-meta">Membrane Filtr. (USP &lt;71&gt;)</text>
    <text x="370" y="202" class="header-meta">14-Day Incubation: Sterile</text>
    <text x="530" y="202" class="mono value bold" fill="#047857">No Growth</text>
    <text x="635" y="202" class="pass">PASS</text>
  </g>

  <!-- ==================== SECTION 4: ANALYTICAL SPECIFICATION & RUO COMPLIANCE ==================== -->
  <g transform="translate(60, 875)">
    <rect x="0" y="0" width="680" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <g transform="translate(25, 20)">
      <text x="0" y="15" class="header-meta">ANALYTICAL ASSAY SPECIFICATION:</text>
      <text x="0" y="42" class="value bold" font-size="13">RP-HPLC / LC-MS In-Vitro Assay</text>
      <line x1="0" y1="52" x2="200" y2="52" stroke="#94a3b8" stroke-width="1" />
      <text x="0" y="70" class="value">Purity Standard: ≥ 98.0% Area</text>
      <text x="0" y="86" class="header-meta">Reversed-Phase C18 Chromatography</text>
    </g>

    <g transform="translate(250, 20)">
      <text x="0" y="15" class="header-meta">REGULATORY &amp; COMPLIANCE STATUS:</text>
      <text x="0" y="42" class="value bold" font-size="13" fill="#b45309">Research Use Only (RUO)</text>
      <line x1="0" y1="52" x2="200" y2="52" stroke="#94a3b8" stroke-width="1" />
      <text x="0" y="70" class="value bold" fill="#dc2626">NOT EVALUATED OR APPROVED BY FDA</text>
      <text x="0" y="86" class="header-meta">In-Vitro Reference Standard Only</text>
    </g>

    <g transform="translate(480, 16)">
      <rect x="0" y="0" width="180" height="115" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="90" cy="42" r="28" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4,2" />
      <text x="90" y="38" text-anchor="middle" class="mono bold" fill="#047857" font-size="8">ANALYTICAL</text>
      <text x="90" y="48" text-anchor="middle" class="mono" fill="#047857" font-size="7">RUO VALIDATED</text>
      <text x="90" y="85" text-anchor="middle" class="mono bold" fill="#0f172a" font-size="8.5">QC RELEASED</text>
      <text x="90" y="98" text-anchor="middle" class="mono" fill="#64748b" font-size="7">CRYPTOGRAPHIC HASH: 8f2b..4e91</text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <g transform="translate(60, 1045)">
    <text x="340" y="0" text-anchor="middle" class="header-meta" font-size="8.5">
      MANDATORY NOTICE: Strictly for in-vitro scientific research and laboratory calibration. Not for human, veterinary, diagnostic, or therapeutic use.
    </text>
    <text x="340" y="14" text-anchor="middle" class="header-meta" font-size="8">
      Analytical In-Vitro Batch Dossier · Page 1 of 1 · © 2026 Analytical Reference Standards
    </text>
  </g>
</svg>
